split:
  train: 0.70
  validation: 0.15
  holdout: 0.15
  stratify: TARGET

models:
  baseline_mean: {}
  logistic_regression:
    C: 0.1
    max_iter: 2000
    class_weight: null
  lightgbm:
    n_estimators: 3000
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.5
    reg_lambda: 5.0
    reg_alpha: 0.0
    early_stopping_rounds: 100
    n_jobs: -1
    verbose: -1

selection:
  primary_metric: roc_auc        # chosen on VALIDATION only
  min_improvement_over_baseline: 0.01

calibration:
  methods: [sigmoid, isotonic]
  cv_folds: 5                    # cross-validated comparison inside the validation set
  selection_metric: brier

threshold:
  policy: review_capacity        # flag the top X% highest-PD applications for manual review
  review_capacity_share: 0.10    # computed on validation scores, frozen before holdout

evaluation:
  calibration_bins: 10
  min_group_size: 500            # fairness/segment rows below this are flagged
  fairness_groups: [CODE_GENDER, age_band, NAME_FAMILY_STATUS, NAME_EDUCATION_TYPE]
  max_auc_drop_alert: 0.05       # holdout AUC more than this below validation AUC -> alert

explain:
  shap_sample_size: 20000
  top_n_features: 15
  reason_codes: 3
